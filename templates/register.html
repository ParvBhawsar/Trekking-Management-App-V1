{% extends 'base.html' %}
{% block title %}Register{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-7 col-lg-6">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h1 class="h3 mb-1">Register as {{ 'Trek Staff' if role == 'staff' else 'Trekker' }}</h1>
                {% if role == 'staff' %}
                    <p class="text-muted">Your account will require admin approval.</p>
                {% endif %}
                <form method="post">
                    <div class="mb-3">
                        <label class="form-label">Full name</label>
                        <input class="form-control" name="name" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input class="form-control" type="email" name="email" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Phone</label>
                        <input class="form-control" name="phone">
                    </div>
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">Password</label>
                            <input class="form-control" type="password" name="password" minlength="6" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Confirm password</label>
                            <input class="form-control" type="password" name="confirm_password" minlength="6" required>
                        </div>
                    </div>
                    <button class="btn btn-success w-100 mt-4" type="submit">Create Account</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
